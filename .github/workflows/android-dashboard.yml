name: Build Dashboard APK
on:
  push:
    branches: [main]   # tag phat hanh Launcher khong build lai APK
    paths: ['android/**', 'bridge/dashboard.html', '.github/workflows/android-dashboard.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Copy dashboard page into app assets
        run: mkdir -p android/app/src/main/assets && cp bridge/dashboard.html android/app/src/main/assets/dashboard.html
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gtadash.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/gtadash.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Chua co secret ANDROID_KEYSTORE_BASE64: APK moi se khong cai de duoc len ban cu."
          fi
      - name: Build
        working-directory: android
        env:
          RUN_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GtaDashboard-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: GtaDashboard-apk, path: 'GtaDashboard-*.apk' }
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dash-${{ github.run_number }}
          name: Dashboard APK ${{ github.run_number }}
          files: GtaDashboard-${{ github.run_number }}.apk
