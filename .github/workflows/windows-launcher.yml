name: Build GTA Viet Life Windows Launcher
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['launcher/**','engine/**','tests/**','bridge/**','game/**','adapters/godot/**','packaging/**','docs/**','.github/workflows/windows-launcher.yml']
  pull_request:
    branches: [main]
    paths: ['launcher/**','engine/**','tests/**','bridge/**','game/**','adapters/godot/**','packaging/**','docs/**','.github/workflows/windows-launcher.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-launcher-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Validate Godot 4 second-game adapter
        shell: pwsh
        run: |
          $release="4.4.1-stable"
          $archive="Godot_v4.4.1-stable_win64.exe.zip"
          $base="https://github.com/godotengine/godot/releases/download/$release"
          Invoke-WebRequest -Uri "$base/$archive" -OutFile godot.zip
          Invoke-WebRequest -Uri "$base/SHA512-SUMS.txt" -OutFile godot-sums.txt
          $line=Get-Content godot-sums.txt | Where-Object { $_ -match [regex]::Escape($archive) } | Select-Object -First 1
          if(!$line){throw "Pinned Godot archive is missing from the official SHA512 manifest."}
          $expected=($line.Trim() -split '\s+')[0].ToLower()
          $actual=(Get-FileHash godot.zip -Algorithm SHA512).Hash.ToLower()
          if($actual -ne $expected){throw "Godot 4.4.1 archive checksum mismatch."}
          Expand-Archive godot.zip godot-runtime -Force
          $godot=Get-ChildItem godot-runtime -Recurse -Filter "Godot_v4.4.1-stable_win64.exe" | Select-Object -First 1
          if(!$godot){throw "Pinned Godot executable not found."}
          & $godot.FullName --headless --editor --path adapters/godot --quit --verbose 2>&1 | Tee-Object godot-validation.log
          if($LASTEXITCODE -ne 0){Get-Content godot-validation.log; throw "Godot headless project import/script parse failed."}
          $token="gvl-ci-smoke-token-2026-11-28-000000000000"
          $tokenFile=Join-Path $PWD "gvl-ci-token.txt"
          $dataDir=Join-Path $PWD "gvl-ci-data"
          Set-Content -Path $tokenFile -Value $token -NoNewline
          $hostProc=Start-Process -FilePath "python" -ArgumentList @("engine/host.py","--host","127.0.0.1","--port","5580","--token-file",$tokenFile,"--data-dir",$dataDir) -PassThru -WindowStyle Hidden
          try {
            $ready=$false
            for($i=0;$i -lt 30;$i++){
              if(Test-NetConnection -ComputerName "127.0.0.1" -Port 5580 -InformationLevel Quiet){$ready=$true;break}
              Start-Sleep -Milliseconds 500
            }
            if(!$ready){throw "Engine Host did not start for Godot live smoke test."}
            $env:GVL_ENGINE_TOKEN=$token
            $env:GVL_GODOT_SMOKE="1"
            & $godot.FullName --headless --path adapters/godot --quit-after 1200 2>&1 | Tee-Object godot-smoke.log
            if($LASTEXITCODE -ne 0){Get-Content godot-smoke.log; throw "Godot live adapter smoke test failed."}
            if(!(Select-String -Path godot-smoke.log -Pattern "GVL_GODOT_SMOKE_OK")){Get-Content godot-smoke.log; throw "Godot live smoke acceptance marker missing."}
          } finally {
            Remove-Item Env:GVL_ENGINE_TOKEN -ErrorAction SilentlyContinue
            Remove-Item Env:GVL_GODOT_SMOKE -ErrorAction SilentlyContinue
            if($hostProc -and !$hostProc.HasExited){Stop-Process -Id $hostProc.Id -Force}
          }
      - name: Set release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = $env:GITHUB_REF_NAME.TrimStart("v") } else { $version = "0.1.0" }
          "GVL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test Engine Host
        run: python -m unittest discover -s engine/tests -v
      - name: Test GTA adapter wire contract and C# send logic
        run: python -m unittest discover -s tests -v
      - name: Test Vietnamese dialogue context integration
        working-directory: bridge
        run: python -m unittest test_engine_context -v
      - name: Compile Python modules
        run: python -m compileall -q bridge engine
      - name: Download and pin SHVDN Enhanced API
        shell: pwsh
        run: |
          $url="https://github.com/Chiheb-Bacha/ScriptHookVDotNetEnhanced/releases/download/v1.1.0.6/ScriptHookVDotNetEnhanced-v1.1.0.6.zip"
          Invoke-WebRequest -Uri $url -OutFile shvdne.zip
          $hash=(Get-FileHash shvdne.zip -Algorithm SHA256).Hash.ToLower()
          if($hash -ne "f10da8819fa6814fb0a04553567d2516934eac96b16af06ad8f315f0da00473a"){throw "SHVDN Enhanced pinned release checksum mismatch."}
          Expand-Archive shvdne.zip shvdne -Force
          $api3=Get-ChildItem shvdne -Recurse -Filter ScriptHookVDotNet3.dll | Select-Object -First 1
          if(!$api3){throw "Pinned SHVDN Enhanced package does not contain ScriptHookVDotNet3.dll."}
          "SHVDN_API3=$($api3.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile modified GTA V Core against pinned SHVDN Enhanced API
        run: dotnet build game/compile/GtaVietLifeCore.Compile.csproj -c Release -p:ShvdnApi3="${{ env.SHVDN_API3 }}"
      - name: Compile GTA V World adapter against pinned SHVDN Enhanced API
        run: dotnet build game/compile/GtaVietLifeWorld.Compile.csproj -c Release -p:ShvdnApi3="${{ env.SHVDN_API3 }}"
      - name: Compile GTA V Economy module against pinned SHVDN Enhanced API
        run: dotnet build game/compile/GtaVietLifeEconomy.Compile.csproj -c Release -p:ShvdnApi3="${{ env.SHVDN_API3 }}"
      - name: Compile GTA V Personal module against pinned SHVDN Enhanced API
        run: dotnet build game/compile/GtaVietLifePersonal.Compile.csproj -c Release -p:ShvdnApi3="${{ env.SHVDN_API3 }}"
      - name: Compile GTA V Chat module against pinned SHVDN Enhanced API
        run: dotnet build game/compile/GtaVietLifeChat.Compile.csproj -c Release -p:ShvdnApi3="${{ env.SHVDN_API3 }}"
      - name: Compile GTA V DoiSong module against pinned SHVDN Enhanced API
        run: dotnet build game/compile/GtaVietLifeDoiSong.Compile.csproj -c Release -p:ShvdnApi3="${{ env.SHVDN_API3 }}"
      - name: Publish Launcher
        run: dotnet publish launcher/GtaVietLife.Launcher/GtaVietLife.Launcher.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.GVL_VERSION }} -p:AssemblyVersion=${{ env.GVL_VERSION }}.0 -p:FileVersion=${{ env.GVL_VERSION }}.0 -o publish/launcher
      - name: Publish updater
        run: dotnet publish launcher/GtaVietLife.Updater/GtaVietLife.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/updater
      - name: Stage updater and game scripts
        shell: pwsh
        run: |
          Copy-Item publish/updater/GtaVietLife.Updater.exe publish/launcher/
          Copy-Item game publish/game -Recurse -Force
      - name: Package Engine Host
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --noconfirm --clean --onefile --name GtaVietLifeEngine engine/host.py
          New-Item -ItemType Directory -Force publish/runtime/engine | Out-Null
          Copy-Item dist/GtaVietLifeEngine.exe publish/runtime/engine/
      - name: Package AI bridge
        shell: pwsh
        run: |
          python -m pip install -r bridge/requirements-launcher.txt pyinstaller
          pyinstaller --noconfirm --clean --onedir --name GtaVietLifeBridge --paths bridge --hidden-import llm --hidden-import memory --hidden-import stt --hidden-import tts --hidden-import overlay --hidden-import engine_context --hidden-import life --hidden-import social --collect-all faster_whisper --collect-all ctranslate2 --collect-all pygame --collect-all sounddevice --collect-all edge_tts --collect-all numpy --add-data "bridge/config.example.json;." bridge/main.py
          New-Item -ItemType Directory -Force publish/runtime/bridge | Out-Null
          Copy-Item dist/GtaVietLifeBridge/* publish/runtime/bridge/ -Recurse -Force
          Copy-Item bridge/config.example.json publish/runtime/bridge/
      - name: Build installer and update package
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/GtaVietLife.iss
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item publish/launcher/* package/ -Recurse -Force
          Copy-Item publish/runtime package/runtime -Recurse -Force
          Copy-Item publish/game package/game -Recurse -Force
          Compress-Archive -Path package/* -DestinationPath artifacts/GtaVietLife-Windows-x64.zip -Force
          $hash=(Get-FileHash artifacts/GtaVietLife-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  GtaVietLife-Windows-x64.zip" | Out-File artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Verify portable package contents
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[System.IO.Compression.ZipFile]::OpenRead("artifacts/GtaVietLife-Windows-x64.zip")
          try {
            $names=$zip.Entries | ForEach-Object { $_.FullName.Replace("\\","/") }
            foreach($required in @("GtaVietLife.Launcher.exe","GtaVietLife.Updater.exe","runtime/engine/GtaVietLifeEngine.exe","runtime/bridge/GtaVietLifeBridge.exe","game/GtaVietLifeCore.cs","game/GtaVietLifeIcons/food.png")) {
              if($names -notcontains $required){throw "Package missing required file: $required"}
            }
          } finally {$zip.Dispose()}
      - name: Verify updater rollback safety
        shell: pwsh
        run: ./launcher/tests/Test-UpdaterRollback.ps1 -UpdaterPath "publish/updater/GtaVietLife.Updater.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: GtaVietLife-Windows-Installer
          path: artifacts/*
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/GtaVietLife-Setup-*.exe
            artifacts/GtaVietLife-Windows-x64.zip
            artifacts/SHA256SUMS.txt
